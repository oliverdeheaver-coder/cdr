<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CADRI Health Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1000px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .label {
      font-size: 14px;
      color: #777;
      margin-bottom: 8px;
    }

    .value {
      font-size: 30px;
      font-weight: bold;
    }

    .unit {
      font-size: 14px;
      color: #777;
    }

    .activity {
      margin-top: 30px;
      max-width: 1000px;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .status {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>CADRI Health Dashboard</h1>

  <div class="subtitle">
    Xiaomi Watch S1 Active / Google Fit
  </div>

  <div class="dashboard">

    <div class="card">
      <div class="label">Steps</div>
      <div class="value" id="steps"></div>
    </div>

    <div class="card">
      <div class="label">Distance</div>
      <div class="value" id="distance"></div>
      <div class="unit">km</div>
    </div>

    <div class="card">
      <div class="label">Calories</div>
      <div class="value" id="calories"></div>
      <div class="unit">kcal</div>
    </div>

    <div class="card">
      <div class="label">Duration</div>
      <div class="value" id="duration"></div>
    </div>

    <div class="card">
      <div class="label">Average Speed</div>
      <div class="value" id="speed"></div>
      <div class="unit">mph</div>
    </div>

  </div>

  <div class="activity">

    <h2>Latest Activity</h2>

    <p><strong>Activity:</strong> Walking</p>

    <p>
      <strong>Date:</strong>
      4 September 2026
    </p>

    <p>
      <strong>Start time:</strong>
      15:12:30
    </p>

    <div class="status" id="status"></div>

  </div>

<script>

const activity = {
  steps: 2670,
  distanceMiles: 1.0585328,
  calories: 204.3306,
  durationSeconds: 2651,
  averageSpeed: 2.1218476
};

const distanceKm =
  activity.distanceMiles * 1.60934;

const minutes =
  Math.floor(activity.durationSeconds / 60);

const seconds =
  activity.durationSeconds % 60;

document.getElementById("steps").innerText =
  activity.steps.toLocaleString();

document.getElementById("distance").innerText =
  distanceKm.toFixed(2);

document.getElementById("calories").innerText =
  Math.round(activity.calories);

document.getElementById("duration").innerText =
  minutes + "m " + seconds + "s";

document.getElementById("speed").innerText =
  activity.averageSpeed.toFixed(2);

document.getElementById("status").innerText =
  "CADRI detected a walking session of " +
  distanceKm.toFixed(2) +
  " km with " +
  activity.steps +
  " steps.";

</script>

</body>
</html>
